#
# Each step is delegated to an existing bash script under ./scripts.
# Task is used purely as the sequencer: it passes the inputs through,
# runs the steps in order, and aborts the whole flow if any step fails.
#
# Usage:
#   task all VERSION=2.19.5 USERNAME=jdoe      # run the full flow
#   task clone VERSION=2.19.5 USERNAME=jdoe    # run a single step
#   task --list                                # see all steps
#
# NOTE: rename the script paths below to match your actual filenames.
 
version: '3'
 
silent: true
 
vars:
  SCRIPTS: ./opensearch

 
includes:
  opensearch: tasks/opensearch.yml
  opensearch-dashboards: tasks/opensearch-dashboards.yml
  common: tasks/common.yml

tasks:
  default:
    desc: List available steps
    cmds:
      - task --list

  release-opensearch:
    desc: "Full flow: clone+tag -> gradle wrappers -> push -> clone build -> localize manifests"
    requires:
      vars: [VERSION, USERNAME]
    cmds:
      - task: opensearch:clone
      - task: opensearch:update-wrappers
      - task: opensearch:push
      - task: opensearch:patch-spotless
      - task: opensearch:clone-opensearch-build
      - task: opensearch:update-opensearch-build-manifests

  release-opensearch-dashboards:
    desc: "Full flow: clone+tag -> gradle wrappers -> push -> clone build -> localize manifests"
    requires:
      vars: [VERSION, LP_USERNAME, PREFIX, JFROG_URL, LAST_VERSION]
    cmds:
      - task: common:parse-manifest
        vars:
          PRODUCT: opensearch-dashboards
          VERSION: '{{.VERSION}}'
      - task: common:clone
        vars:
          PRODUCT: opensearch-dashboards
          VERSION: '{{.VERSION}}'
          PREFIX: '{{.PREFIX}}'
          LP_USERNAME: '{{.LP_USERNAME}}'
      - task: opensearch-dashboards:patches
        vars:
          VERSION: '{{.VERSION}}'
          PREFIX: '{{.PREFIX}}'
          JFROG_URL: '{{.JFROG_URL}}'

      - task: common:clone-opensearch-build
        vars:
          VERSION: '{{.VERSION}}'
          PREFIX: '{{.PREFIX}}'
          LP_USERNAME: '{{.LP_USERNAME}}'
          LAST_VERSION: '{{.LAST_VERSION}}'
      - task: common:update-manifests-opensearch-build
        vars:
          VERSION: '{{.VERSION}}'
          PREFIX: '{{.PREFIX}}'
          PRODUCT: opensearch-dashboards
      - task: common:update-launchpad
        vars:
          VERSION: '{{.VERSION}}'
          PREFIX: '{{.PREFIX}}'
          LAST_VERSION: '{{.LAST_VERSION}}'
          PRODUCT: opensearch-dashboards
      
 
 