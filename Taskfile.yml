version: '3'
silent: false

tasks:
  default:
    cmds:
      - task --list

  all:
    desc: "Opensearch and dashboards full workflow"
    cmds:
      - task: opensearch-build:clone
      - task: opensearch-build:patch
      - task: opensearch:all
      - task: dashboards:all
      - task: opensearch-build:update

  opensearch-build:clone:
    desc: "opensearch-build: clone from upstream"
    cmds:
      - "bash ./opensearch-build/clone.sh"

  opensearch-build:patch:
    desc: "opensearch-build: apply patches"
    cmds:
      - "bash ./opensearch-build/patch.sh"

  opensearch-build:update:
    desc: "opensearch-build: full workflow"
    cmds:
      - task: opensearch:update-launchpad
      - task: opensearch:update-manifest
      - task: dashboards:update-launchpad
      - task: dashboards:update-manifest

  opensearch-build:all:
    desc: "opensearch-build: full workflow"
    cmds:
      - task: opensearch-build:clone
      - task: opensearch-build:patch
      - task: opensearch-build:update

  opensearch:all:
    desc: "OpenSearch: full workflow"
    cmds:
      - task: opensearch:clone
      - task: opensearch:patch
      - task: opensearch:update-submodules
      - task: opensearch:push

  opensearch:update-submodules:
    desc: "OpenSearch: clone and push knn submodules"
    cmds:
      - "bash ./scripts/update_submodules.sh"

  opensearch:clone:
    desc: "OpenSearch: clone all repos, create LP branches and tags"
    cmds:
      - "bash ./scripts/clone.sh opensearch"

  opensearch:patch:
    desc: "OpenSearch: apply patches"
    cmds:
      - "bash ./scripts/patch.sh opensearch"

  opensearch:push:
    desc: "OpenSearch: push branches and tags to Launchpad"
    cmds:
      - "bash ./scripts/push.sh opensearch"

  opensearch:update-manifest:
    desc: "OpenSearch: update manifest URLs"
    cmds:
      - "bash ./scripts/update_manifest.sh opensearch"

  opensearch:update-launchpad:
    desc: "OpenSearch: update .launchpad.yaml"
    cmds:
      - "bash ./scripts/update_launchpad.sh opensearch"

  dashboards:all:
    desc: "Dashboards: full workflow"
    cmds:
      - task: dashboards:clone
      - task: dashboards:patch
      - task: dashboards:push

  dashboards:clone:
    desc: "Dashboards: clone all repos, create LP branches and tags"
    cmds:
      - "bash ./scripts/clone.sh opensearch-dashboards"

  dashboards:patch:
    desc: "Dashboards: apply patches"
    cmds:
      - "bash ./scripts/patch.sh opensearch-dashboards"

  dashboards:push:
    desc: "Dashboards: push branches and tags to Launchpad"
    cmds:
      - "bash ./scripts/push.sh opensearch-dashboards"

  dashboards:update-manifest:
    desc: "Dashboards: update manifest URLs"
    cmds:
      - "bash ./scripts/update_manifest.sh opensearch-dashboards"

  dashboards:update-launchpad:
    desc: "Dashboards: update .launchpad.yaml"
    cmds:
      - "bash ./scripts/update_launchpad.sh opensearch-dashboards"

  check-artifacts:
    desc: "Check if artifacts exist in Artifactory"
    cmds:
      - "bash ./scripts/check_artifacts.sh"

  upload-artifacts:
    desc: "Upload missing artifacts to Artifactory"
    cmds:
      - "bash ./scripts/upload_artifacts.sh"
